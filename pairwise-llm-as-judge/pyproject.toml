[project]
name = "langfuse-pairwise-llm-as-judge"
version = "0.1.0"
description = "Pairwise LLM-as-a-judge workflow on Langfuse, following arxiv 2411.15594"
requires-python = ">=3.10"
dependencies = [
    "langfuse>=4.5.1",
    "openai>=2.35.1",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pairwise_judge"]
